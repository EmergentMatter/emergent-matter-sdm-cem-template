# cem.toml: this CEM's declared surface.
#
# A tool reads this file WITHOUT importing anything: `sdm-sidecar cem show`
# parses it and never resolves `entry_point`. Keep it that way.
#
# `role` says what a change COSTS: live (a uniform write), re-emit (baked into
# the shader; sub-second), topology (changes the node count), derived (a floor
# feeding validate()), tool (configures the toolchain, not the design).
# `emits` is the name the param carries in the emitted .sdm: the type prefix
# stripped, so d_length ships as length.
#
# Derived values (d_half_min_side) are NOT declared here. They are @property on
# the dataclass: a manifest declares surface, not a second copy of the model.
#
# Every dimension is free, an input, or driven (Rob, 2026-11-04), and nothing
# dangles. `origin` says which of the first two a declared param is:
#   free   picked within `bounds`; an optimizer may move it
#   input  set from outside the part; fixed unless `tradeable = true`
# Driven dimensions are computed (@property) and never declared here. Which
# dimensions are DRIVING is not declared either: sdm-core's dimension audit
# finds it by nudging each one and watching what moves. Tool settings
# (role = "tool") need no origin.
#
# `source` says where the value comes from, and every param has one. One of:
#   requirement:<id>          a line of the project's requirements file
#   part:<vendor>:<number>    a bought part's catalogue page (its dimensions)
#   standard:<name, clause>   a published table (thread, clearance, fit)
#   process:<profile>:<limit> a manufacturing limit (minimum wall, hole)
#   parent:<assembly>:<param> a dimension the parent assembly sets
#   choice: <why>             a design decision, with its reason in one line
#   tool: <what>              configures the toolchain, not the part
# Every other number in the part is computed from these (@property), and
# tests/test_dimensions.py fails on a number typed into the shape code.
#
# The annotated version, with every role, `emits`, bounds and constraint
# explained, is examples/bushing_sdf/cem.toml.

[cem]
name = "widget"
version = "0.1.0"
authors = ["Emergent Matter"]
description = "A rounded block. Template CEM. Copy it and replace the shape."
sdm_core = ">=0.1"
spec_version = 1
entry_point = "widget_sdf.sdm.assembly:build_widget_part"

[cem.params.d_length]
type = "float"
default = 40.0
unit = "mm"
role = "re-emit"
bounds = [5.0, 200.0]
emits = "length"
doc = "Extent along x."
source = "requirement:F1.1 (example ID: the length the mating pocket takes)"
origin = "input"

[cem.params.d_width]
type = "float"
default = 30.0
unit = "mm"
role = "re-emit"
bounds = [5.0, 200.0]
emits = "width"
doc = "Extent along y."
source = "requirement:F1.2 (example ID: the width the mating pocket takes)"
origin = "input"

[cem.params.d_height]
type = "float"
default = 20.0
unit = "mm"
role = "re-emit"
bounds = [5.0, 200.0]
emits = "height"
doc = "Extent along z. The block stands on z = 0."
source = "requirement:F1.3 (example ID: the height under the cover it fits beneath)"
origin = "input"

[cem.params.d_edge_radius]
type = "float"
default = 3.0
unit = "mm"
role = "re-emit"
bounds = [0.0, 20.0]
emits = "edge_radius"
doc = "Radius of the twelve rounded edges. 0 gives sharp edges."
source = "choice: example value; rounds the edges so nothing sharp is handled, well under half the smallest side"
origin = "free"

[cem.params.d_voxel_size_mm]
type = "float"
default = 0.25
unit = "mm"
role = "tool"
bounds = [0.02, 2.0]
doc = "Default voxel size for meshing. Not design surface: it configures the toolchain."
source = "tool: meshing resolution for exports; does not change the design"

# ── Constraints: the rules no per-param bound can express ──────────────────
#
# Each constraint is ALSO enforced in WidgetParameters.validate(), and a test
# asserts that every name here appears there.

[[cem.constraints]]
name = "edge_radius_below_half_smallest_side"
expr = "d_edge_radius < d_half_min_side"
why = "the radius is carved out of the half-extents, so a larger one has no block left; checked against a DERIVED value, so it cannot be a bound on any declared param"

[[cem.objectives]]
name = "minimize_mass"
sense = "minimize"
unit = "g"
