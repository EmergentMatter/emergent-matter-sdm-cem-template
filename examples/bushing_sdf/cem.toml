# cem.toml: the flanged bushing example's declared surface, annotated.
#
# This file is documentation: a tool reads the repo root's cem.toml, not this
# one. The root file is short; this is the full annotated version it points at.
#
# A cem.toml is what a tool reads when handed a repo, and it is read WITHOUT
# importing anything: `sdm-sidecar cem show` parses it and never
# resolves `entry_point`. Keep it that way: the moment
# reading a manifest runs code, "list the CEMs I have" becomes a supply-chain
# question.
#
# `role` says what a change COSTS:
#   live:     bound a shader uniform; changing it is a uniform write
#   re-emit:  baked into the shader; a change means re-emitting (sub-second)
#   topology: changes how many nodes the tree has; authoring script only
#   derived:  a floor or limit feeding validate(), not geometry
#   tool:     configures the toolchain, not the design
#
# `emits` is the name the param carries in the emitted .sdm. This CEM strips
# the type prefix, so d_outer_radius ships as outer_radius; recording it is
# what lets a consumer join a CEM to its own output without guessing.
#
# Derived values (d_bore_radius, d_bolt_angular_pitch, d_flange_ligament) are
# NOT declared here. They are @property on the dataclass and they stay there:
# a manifest declares surface, not a second copy of the model.
#
# Every dimension is free, an input, or driven (Rob, 2026-11-04), and nothing
# dangles. `origin` says which of the first two a declared param is:
#   free   picked within `bounds`; an optimizer may move it
#   input  set from outside the part; fixed unless `tradeable = true`
# Driven dimensions are computed (@property) and never declared here. Which
# dimensions are DRIVING is not declared either: sdm-core's dimension audit
# finds it by nudging each one and watching what moves. Tool settings
# (role = "tool") need no origin.
#
# `source` says where the value comes from, and every param has one. One of:
#   requirement:<id>          a line of the project's requirements file
#   part:<vendor>:<number>    a bought part's catalogue page (its dimensions)
#   standard:<name, clause>   a published table (thread, clearance, fit)
#   process:<profile>:<limit> a manufacturing limit (minimum wall, hole)
#   parent:<assembly>:<param> a dimension the parent assembly sets
#   choice: <why>             a design decision, with its reason in one line
#   tool: <what>              configures the toolchain, not the part
# Every other number in the part is computed from these (@property), and
# tests/test_dimensions.py fails on a number typed into the shape code.

[cem]
name = "bushing"
version = "0.1.0"
authors = ["Emergent Matter"]
description = "A flanged bushing. Template CEM. Copy it and replace the shape."
sdm_core = ">=0.1"
spec_version = 1
entry_point = "bushing_sdf.bushing:build_bushing_part"

[cem.params.n_bolt_holes]
type = "int"
default = 6
unit = "count"
role = "topology"
bounds = [0, 24]
emits = "bolt_holes"
doc = "Number of holes in the flange bolt circle. 0 removes the bolt circle."
source = "choice: six bolts spread the clamp load around the flange and still leave a ligament above flange_ligament_floor"
origin = "free"

[cem.params.d_outer_radius]
type = "float"
default = 12.0
unit = "mm"
role = "live"
bounds = [4.0, 60.0]
emits = "outer_radius"
doc = "Outer radius of the tube."
source = "requirement:F1.1 (example ID: the tube OD the mating housing bore takes)"
origin = "input"

[cem.params.d_wall_thickness]
type = "float"
default = 3.0
unit = "mm"
role = "live"
bounds = [0.8, 20.0]
emits = "wall_thickness"
doc = "Tube wall thickness. The bore follows from this."
source = "choice: example value the optimizer may move; a real CEM keeps it above its process's minimum wall"
origin = "free"

[cem.params.d_length]
type = "float"
default = 30.0
unit = "mm"
role = "re-emit"
bounds = [5.0, 200.0]
emits = "length"
doc = "Overall axial length, flange included."
source = "requirement:F1.2 (example ID: the length of the housing it passes through)"
origin = "input"

[cem.params.d_flange_radius]
type = "float"
default = 20.0
unit = "mm"
role = "live"
bounds = [5.0, 100.0]
emits = "flange_radius"
doc = "Flange outer radius."
source = "choice: wide enough to carry the bolt circle with a ligament on both sides of each hole"
origin = "free"

[cem.params.d_flange_thickness]
type = "float"
default = 4.0
unit = "mm"
role = "re-emit"
bounds = [1.0, 30.0]
emits = "flange_thickness"
doc = "Flange axial thickness."
source = "choice: example value the optimizer may move; a real CEM sizes it from the bolt clamp load"
origin = "free"

[cem.params.d_bolt_hole_radius]
type = "float"
default = 1.7
unit = "mm"
role = "re-emit"
bounds = [0.5, 10.0]
emits = "bolt_hole_radius"
doc = "Radius of each bolt hole. 1.7 is M3 clearance."
source = "standard:ISO 273 medium clearance for M3 (3.4 mm diameter)"
origin = "input"

[cem.params.d_bolt_circle_radius]
type = "float"
default = 16.0
unit = "mm"
role = "re-emit"
bounds = [3.0, 90.0]
emits = "bolt_circle_radius"
doc = "Radius of the circle the bolt holes sit on."
source = "choice: anywhere between the tube and the flange edge that leaves a ligament both sides of each hole"
origin = "free"

[cem.params.d_voxel_size_mm]
type = "float"
default = 0.25
unit = "mm"
role = "tool"
bounds = [0.02, 2.0]
doc = "Default voxel size for meshing. Not design surface: it configures the toolchain."
source = "tool: meshing resolution for exports; does not change the design"

# ── Constraints: the rules no per-param bound can express ──────────────────
#
# Each one is ALSO enforced in BushingParameters.validate(), and a test asserts
# that every name here appears there. The manifest is what a tool reads; the
# Python is what runs. Without that test they drift, and the manifest becomes
# a description of a design nobody is building.

[[cem.constraints]]
name = "wall_thickness_below_outer_radius"
expr = "d_wall_thickness < d_outer_radius"
why = "otherwise there is no bore: a pairwise inequality, which per-param bounds cannot express"

[[cem.constraints]]
name = "flange_exceeds_tube"
expr = "d_flange_radius > d_outer_radius"
why = "a flange no wider than the tube is not a flange"

[[cem.constraints]]
name = "bolt_circle_within_flange"
expr = "d_outer_radius < d_bolt_circle_radius < d_flange_radius"
why = "holes must land in flange material; a three-way ordering"

[[cem.constraints]]
name = "flange_ligament_floor"
expr = "d_flange_ligament >= 2.0"
why = "checked against a DERIVED value that depends on n_bolt_holes, so it cannot be a bound on any declared param. Below the floor the flange is a perforation."

[[cem.constraints]]
name = "flange_within_length"
expr = "d_flange_thickness < d_length"
why = "the flange is part of the overall length, not additional to it"

[[cem.objectives]]
name = "minimize_mass"
sense = "minimize"
unit = "g"
